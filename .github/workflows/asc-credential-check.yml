name: Apple CI credential check

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: asc-credential-check
  cancel-in-progress: false

jobs:
  verify-apple-access:
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    environment: ios-feasibility-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify key and read only the feasibility records
        shell: bash
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          set +x
          ulimit -c 0
          node --input-type=module <<'JS'
          import { createPrivateKey, createPublicKey, sign, verify } from 'node:crypto';
          const fail = message => { console.log(message); process.exit(1); };
          try {
            const { ASC_API_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID } = process.env;
            if (!ASC_API_KEY_P8 || !ASC_KEY_ID || !ASC_ISSUER_ID)
              fail('FAIL: required Apple signing secret or environment variables are missing.');
            if (!/^[A-Z0-9]{10}$/.test(ASC_KEY_ID) ||
                !/^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i.test(ASC_ISSUER_ID))
              fail('FAIL: Apple key ID or issuer ID format is invalid.');
            const pem = ASC_API_KEY_P8.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').trim();
            if (!/^-----BEGIN PRIVATE KEY-----\n[A-Za-z0-9+/=\n]+\n-----END PRIVATE KEY-----$/.test(pem))
              fail('FAIL: secret must contain the complete original private-key PEM, without wrapper text.');
            const key = createPrivateKey(pem);
            if (key.asymmetricKeyType !== 'ec' ||
                key.asymmetricKeyDetails?.namedCurve !== 'prime256v1')
              fail('FAIL: Apple CI private key is not P-256.');
            const paths = ['/v1/apps/6816454718', '/v1/bundleIds/4MNR75KAAD'];
            const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const unsigned = [
              encode({ alg: 'ES256', kid: ASC_KEY_ID, typ: 'JWT' }),
              encode({ iss: ASC_ISSUER_ID, iat: now, exp: now + 120,
                       aud: 'appstoreconnect-v1', scope: paths.map(path => 'GET ' + path) })
            ].join('.');
            const signature = sign('sha256', Buffer.from(unsigned),
              { key, dsaEncoding: 'ieee-p1363' });
            if (!verify('sha256', Buffer.from(unsigned),
                { key: createPublicKey(key), dsaEncoding: 'ieee-p1363' }, signature))
              fail('FAIL: local Apple CI signature verification failed.');
            console.log('PASS: Apple CI P-256 key import and ES256 sign/verify.');
            const token = unsigned + '.' + signature.toString('base64url');
            for (let index = 0; index < paths.length; index++) {
              const response = await fetch('https://api.appstoreconnect.apple.com' + paths[index], {
                method: 'GET', redirect: 'error',
                headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
                signal: AbortSignal.timeout(15000)
              });
              if (!response.ok)
                fail('FAIL: Apple read-only request ' + (index + 1) + ' returned HTTP ' + response.status + '.');
              const result = await response.json();
              const expectedType = index === 0 ? 'apps' : 'bundleIds';
              const actualBundle = index === 0 ? result.data?.attributes?.bundleId :
                result.data?.attributes?.identifier;
              if (result.data?.type !== expectedType ||
                  result.data?.id !== paths[index].split('/').at(-1) ||
                  actualBundle !== 'ai.slimy.slimetalk.feasibility')
                fail('FAIL: Apple returned an unexpected feasibility record.');
              console.log(index === 0 ?
                'PASS: Apple CI key can read the exact TestFlight app record.' :
                'PASS: Apple CI key can read the exact registered feasibility App ID.');
            }
            console.log('No signing resources, account settings, apps, or builds were changed.');
            console.log('Cloud signing, provisioned entitlements, APNs delivery, and F1-F7 are NOT TESTED.');
          } catch {
            fail('FAIL: Apple CI check did not complete; sensitive error details suppressed.');
          }
          JS
