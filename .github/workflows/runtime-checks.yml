name: Runtime feasibility safety and APK
on:
  push:
    branches: [main]
    paths: ['controller/**','android/**','ci/**','.github/workflows/runtime-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test controller/test/*.mjs
      - run: python3 ci/security_check.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: bash android/gradlew -p android testDebugUnitTest assembleDebug --no-daemon
      - name: Record APK identity
        run: |
          git rev-parse HEAD
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: slime-talk-feasibility-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
