name: APNs credential format check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/apns-credential-check.yml']

permissions: {}

concurrency:
  group: apns-credential-format-check
  cancel-in-progress: false

jobs:
  validate-format:
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Compile the local-only validator without credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/ValidateAPNs.swift" <<'SWIFT'
          import Foundation
          import CryptoKit
          import Darwin

          func validKey(_ pem: String) -> Bool {
              let trimmed = pem.trimmingCharacters(in: .whitespacesAndNewlines)
              guard trimmed.hasPrefix("-----BEGIN PRIVATE KEY-----"),
                    trimmed.hasSuffix("-----END PRIVATE KEY-----"),
                    !trimmed.contains("\\n") else { return false }
              do {
                  let key = try P256.Signing.PrivateKey(pemRepresentation: trimmed)
                  let message = Data("slime_talk local credential format check".utf8)
                  let signature = try key.signature(for: message)
                  return key.publicKey.isValidSignature(signature, for: message)
              } catch {
                  return false
              }
          }

          // Synthetic test keys exist only in this process; no key material is printed.
          if CommandLine.arguments.contains("--self-test") {
              let pem = P256.Signing.PrivateKey().pemRepresentation
              let tests = [
                  validKey(pem),
                  validKey("\n" + pem + "\n"),
                  !validKey(""),
                  !validKey("invalid"),
                  !validKey(pem.replacingOccurrences(of: "\n", with: "\\n")),
                  !validKey(P256.Signing.PrivateKey().publicKey.pemRepresentation)
              ]
              guard tests.allSatisfy({ $0 }) else {
                  print("FAIL: validator self-test.")
                  exit(1)
              }
              print("PASS: six synthetic validator checks.")
              exit(0)
          }

          guard let pem = ProcessInfo.processInfo.environment["APNS_AUTH_KEY_P8"],
                validKey(pem) else {
              print("FAIL: expected one complete P-256 private-key PEM with real line breaks.")
              exit(1)
          }
          print("PASS: stored APNs secret is a usable P-256 private-key PEM.")
          print("APNs authorization, key identity, push delivery, and F1-F7 are NOT TESTED.")
          SWIFT
          xcrun swiftc "$RUNNER_TEMP/ValidateAPNs.swift" -o "$RUNNER_TEMP/validate-apns"
          "$RUNNER_TEMP/validate-apns" --self-test

      - name: Validate encrypted secret in memory
        shell: bash
        env:
          APNS_AUTH_KEY_P8: ${{ secrets.APNS_AUTH_KEY_P8 }}
        run: |
          set -euo pipefail
          set +x
          ulimit -c 0
          "$RUNNER_TEMP/validate-apns"

      - name: Remove validator files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/ValidateAPNs.swift" "$RUNNER_TEMP/validate-apns"
