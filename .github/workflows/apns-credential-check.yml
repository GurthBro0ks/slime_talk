name: APNs credential format check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/apns-credential-check.yml']

permissions: {}

concurrency:
  group: apns-credential-format-check
  cancel-in-progress: false

jobs:
  validate-format:
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Compile the local-only validator without credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/ValidateAPNs.swift" <<'SWIFT'
          import Foundation
          import CryptoKit
          import Darwin

          func validKey(_ pem: String) -> Bool {
              let trimmed = pem.trimmingCharacters(in: .whitespacesAndNewlines)
              guard trimmed.hasPrefix("-----BEGIN PRIVATE KEY-----"),
                    trimmed.hasSuffix("-----END PRIVATE KEY-----"),
                    !trimmed.contains("\\n") else { return false }
              do {
                  let key = try P256.Signing.PrivateKey(pemRepresentation: trimmed)
                  let message = Data("slime_talk local credential format check".utf8)
                  let signature = try key.signature(for: message)
                  return key.publicKey.isValidSignature(signature, for: message)
              } catch {
                  return false
              }
          }

          // Synthetic test keys exist only in this process; no key material is printed.
          if CommandLine.arguments.contains("--self-test") {
              let pem = P256.Signing.PrivateKey().pemRepresentation
              let tests = [
                  validKey(pem),
                  validKey("\n" + pem + "\n"),
                  !validKey(""),
                  !validKey("invalid"),
                  !validKey(pem.replacingOccurrences(of: "\n", with: "\\n")),
                  !validKey(P256.Signing.PrivateKey().publicKey.pemRepresentation)
              ]
              guard tests.allSatisfy({ $0 }) else {
                  print("FAIL: validator self-test.")
                  exit(1)
              }
              print("PASS: six synthetic validator checks.")
              exit(0)
          }

          guard let stored = ProcessInfo.processInfo.environment["APNS_AUTH_KEY_P8"],
                !stored.isEmpty else {
              print("FAIL: APNs secret is absent or empty.")
              exit(1)
          }
          let normalized = stored
              .replacingOccurrences(of: "\r\n", with: "\n")
              .replacingOccurrences(of: "\r", with: "\n")
              .trimmingCharacters(in: .whitespacesAndNewlines.union(CharacterSet(charactersIn: "\u{FEFF}")))
          let begin = "-----BEGIN PRIVATE KEY-----"
          let end = "-----END PRIVATE KEY-----"
          guard normalized.components(separatedBy: begin).count == 2,
                normalized.components(separatedBy: end).count == 2,
                let first = normalized.range(of: begin),
                let last = normalized.range(of: end),
                first.lowerBound < last.lowerBound else {
              print("FAIL: expected exactly one complete PRIVATE KEY PEM block.")
              print("FORMAT: complete_private_key_block=absent_or_ambiguous")
              exit(1)
          }
          let pem = String(normalized[first.lowerBound..<last.upperBound])
          guard !pem.contains("\\n") else {
              print("FAIL: key uses literal backslash-n characters instead of line breaks.")
              exit(1)
          }
          let body = pem.replacingOccurrences(of: begin, with: "")
              .replacingOccurrences(of: end, with: "")
              .components(separatedBy: .whitespacesAndNewlines).joined()
          guard Data(base64Encoded: body) != nil else {
              print("FAIL: PEM body is not valid base64.")
              exit(1)
          }
          let openssl = Process()
          openssl.executableURL = URL(fileURLWithPath: "/usr/bin/openssl")
          openssl.arguments = ["pkey", "-text", "-noout"]
          openssl.environment = ["PATH": "/usr/bin:/bin"]
          let input = Pipe()
          let output = Pipe()
          let errors = Pipe()
          openssl.standardInput = input
          openssl.standardOutput = output
          openssl.standardError = errors
          do {
              try openssl.run()
              input.fileHandleForWriting.write(Data((pem + "\n").utf8))
              try input.fileHandleForWriting.close()
              let description = String(decoding: output.fileHandleForReading.readDataToEndOfFile(), as: UTF8.self)
              _ = errors.fileHandleForReading.readDataToEndOfFile()
              openssl.waitUntilExit()
              guard openssl.terminationStatus == 0,
                    description.contains("ASN1 OID: prime256v1") else {
                  print("FAIL: OpenSSL cannot parse the PEM as a P-256 private key.")
                  exit(1)
              }
          } catch {
              print("FAIL: independent local parser could not execute.")
              exit(1)
          }
          print("PASS: OpenSSL independently parsed a P-256 private key.")
          guard validKey(pem) else {
              print("FAIL: CryptoKit could not import/sign with the OpenSSL-valid P-256 key.")
              exit(1)
          }
          print("PASS: stored APNs secret contains a usable P-256 private-key PEM.")
          print(normalized == pem
              ? "FORMAT: no wrapper text; only line-ending/outer-whitespace normalization applied."
              : "FORMAT: extra text exists outside the valid PEM block; stored secret was not modified.")
          print("APNs authorization, key identity, push delivery, and F1-F7 are NOT TESTED.")
          SWIFT
          xcrun swiftc "$RUNNER_TEMP/ValidateAPNs.swift" -o "$RUNNER_TEMP/validate-apns"
          "$RUNNER_TEMP/validate-apns" --self-test

      - name: Validate encrypted secret in memory
        shell: bash
        env:
          APNS_AUTH_KEY_P8: ${{ secrets.APNS_AUTH_KEY_P8 }}
        run: |
          set -euo pipefail
          set +x
          ulimit -c 0
          "$RUNNER_TEMP/validate-apns"

      - name: Remove validator files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/ValidateAPNs.swift" "$RUNNER_TEMP/validate-apns"
