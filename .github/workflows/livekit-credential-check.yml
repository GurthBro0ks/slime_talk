name: LiveKit credential check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/livekit-credential-check.yml']

permissions: {}

concurrency:
  group: livekit-credential-check
  cancel-in-progress: false

jobs:
  verify-project-access:
    if: ${{ github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify credentials through a read-only room query
        shell: bash
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          set -euo pipefail
          set +x
          ulimit -c 0
          node --input-type=module <<'JS'
          import { createHmac } from 'node:crypto';
          try {
            const { LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET } = process.env;
            if (!LIVEKIT_URL || !LIVEKIT_API_KEY || !LIVEKIT_API_SECRET) {
              console.log('FAIL: a required LiveKit secret is missing.');
              process.exit(1);
            }
            const url = new URL(LIVEKIT_URL);
            if (url.protocol !== 'wss:' || !url.hostname.endsWith('.livekit.cloud') ||
                url.username || url.password || url.port || url.search || url.hash ||
                (url.pathname && url.pathname !== '/')) {
              console.log('FAIL: unexpected LiveKit Cloud endpoint format.');
              process.exit(1);
            }
            const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
            const now = Math.floor(Date.now() / 1000);
            const unsigned = [
              encode({ alg: 'HS256', typ: 'JWT' }),
              encode({ iss: LIVEKIT_API_KEY, iat: now, nbf: now - 5, exp: now + 60,
                       video: { roomList: true } })
            ].join('.');
            const signature = createHmac('sha256', LIVEKIT_API_SECRET)
              .update(unsigned).digest('base64url');
            const token = unsigned + '.' + signature;
            const response = await fetch(
              'https://' + url.hostname + '/twirp/livekit.RoomService/ListRooms',
              {
                method: 'POST',
                redirect: 'error',
                headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ names: ['slime-talk-feasibility'] }),
                signal: AbortSignal.timeout(15000)
              }
            );
            if (!response.ok) {
              console.log('FAIL: LiveKit room query returned HTTP ' + response.status + '.');
              process.exit(1);
            }
            const result = await response.json();
            if (typeof result !== 'object' || result === null ||
                ('rooms' in result && !Array.isArray(result.rooms))) {
              console.log('FAIL: unexpected room-service response.');
              process.exit(1);
            }
            console.log('PASS: LiveKit accepted the stored project credentials for ListRooms.');
            console.log('No rooms, participants, recordings, agents, or paid resources were created.');
            console.log('Media transport, controller authorization, and F1-F7 are NOT TESTED.');
          } catch {
            console.log('FAIL: LiveKit credential check did not complete; no sensitive error details emitted.');
            process.exit(1);
          }
          JS
